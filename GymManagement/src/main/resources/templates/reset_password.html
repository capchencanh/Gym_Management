<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Gym Management</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-wrapper register-wrapper">
        <div class="auth-form-container">
            <div class="auth-form-header">
                <h2>Đặt lại mật khẩu</h2>
                <p>Nhập mật khẩu mới của bạn</p>
            </div>
            
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/reset-password}" method="post" class="auth-form">
                <input type="hidden" name="token" th:value="${token}">
                
                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu mới</label>
                    <input type="password" class="form-input" id="password" name="password" 
                           placeholder="Nhập mật khẩu mới" required minlength="6">
                    <small class="form-text">Mật khẩu phải có ít nhất 6 ký tự</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" 
                           placeholder="Nhập lại mật khẩu mới" required minlength="6">
                </div>

                <button type="submit" class="btn-auth">
                    Đặt lại mật khẩu
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="/login">Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script>

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (password !== confirmPassword) {
                this.setCustomValidity('Mật khẩu xác nhận không khớp');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
