<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gym Management System</title>
    <th:block th:replace="base :: head"></th:block>
    <style>
        .main-container {
            display: flex;
            min-height: calc(100vh - 200px);
        }
        
        .left-section {
            flex: 1;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .right-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .hero-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .welcome-heading {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.2;
            color: #2c3e50;
        }
        
        .tagline {
            font-style: italic;
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 50px;
            line-height: 1.5;
        }
        
        .auth-buttons {
            display: flex;
            gap: 20px;
        }
        
        .auth-btn {
            padding: 15px 40px;
            border: 2px solid #3498db;
            background: none;
            color: #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
        }
        
        .auth-btn:hover {
            background-color: #3498db;
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .auth-btn.register {
            border-color: #27ae60;
            color: #27ae60;
        }
        
        .auth-btn.register:hover {
            background-color: #27ae60;
            color: white;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }
        
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .welcome-heading {
                font-size: 2.5rem;
            }
            
            .auth-buttons {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div th:replace="base :: header"></div>
    
    <div class="main-container">
        <div class="left-section">
            <h1 class="welcome-heading">Welcome Back!<br>Log In to Your Account</h1>
            <p class="tagline">"Behind Every Strong Gym Is a Strong System."</p>
            <div class="auth-buttons">
                <a href="/login" class="auth-btn">Login</a>
                <a href="/register" class="auth-btn register">Register</a>
            </div>
        </div>
        

        <div class="right-section">
            <img src="https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" 
                 alt="Gym Equipment" 
                 class="hero-image">
        </div>
    </div>
    
    <div th:replace="base :: footer"></div>
</body>
</html>
