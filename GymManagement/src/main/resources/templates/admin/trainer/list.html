<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý huấn luyện viên</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-tie me-2"></i>Quản lý huấn luyện viên
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div class="mb-3">
                            <a href="/admin/trainers/create" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>Thêm huấn luyện viên mới
                            </a>
                        </div>
                        <div class="card mb-3">
                            <div class="card-body">
                                <form th:action="@{/admin/trainers}" method="get" class="row g-3">
                                    <div class="col-md-8">
                                        <label for="keyword" class="form-label">Tìm kiếm</label>
                                        <input type="text" class="form-control" id="keyword" name="keyword" 
                                               th:value="${keyword}" placeholder="Nhập tên, email hoặc số điện thoại...">
                                    </div>
                                    <div class="col-md-4 d-flex align-items-end">
                                        <button type="submit" class="btn btn-primary me-2">
                                            <i class="fas fa-search me-1"></i>Tìm kiếm
                                        </button>
                                        <a href="/admin/trainers" class="btn btn-secondary">
                                            <i class="fas fa-refresh me-1"></i>Làm mới
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <h5>Tổng số</h5>
                                        <h3 th:text="${totalTrainers}">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h5>Đang hoạt động</h5>
                                        <h3 th:text="${activeTrainers}">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-warning text-white">
                                    <div class="card-body text-center">
                                        <h5>Đã xóa</h5>
                                        <h3 th:text="${inactiveTrainers}">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Họ tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                        <th>Chuyên môn</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="trainer : ${trainers}">
                                        <td th:text="${trainer.trainerId}"></td>
                                        <td th:text="${trainer.user.name}"></td>
                                        <td th:text="${trainer.user.email}"></td>
                                        <td th:text="${trainer.user.phoneNumber}"></td>
                                        <td>
                                            <span th:if="${trainer.specialization != null && trainer.specialization != ''}" 
                                                  th:text="${trainer.specialization}"></span>
                                            <span th:if="${trainer.specialization == null || trainer.specialization == ''}" 
                                                  class="text-muted">-</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/admin/trainers/view/{id}(id=${trainer.trainerId})}" 
                                               class="btn btn-sm btn-info me-1" title="Xem">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/admin/trainers/edit/{id}(id=${trainer.trainerId})}" 
                                               class="btn btn-sm btn-warning me-1" title="Sửa">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <button type="button" class="btn btn-sm btn-danger delete-btn" 
                                                    title="Xóa"
                                                    th:data-trainer-id="${trainer.trainerId}"
                                                    th:data-trainer-name="${trainer.user.name}">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(trainers)}">
                                        <td colspan="6" class="text-center text-muted py-4">
                                            <i class="fas fa-user-tie fa-2x mb-2"></i>
                                            <p>Không có dữ liệu huấn luyện viên</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        

                        
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="text-muted">
                                <span th:text="${totalItems}">0</span> kết quả
                                <span th:if="${totalPages > 0}">
                                    (Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span>)
                                </span>
                            </div>
                            
                            <nav th:if="${totalPages > 0}">
                                <ul class="pagination pagination-sm mb-0">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" 
                                           th:href="@{/admin/trainers(page=${currentPage - 1}, size=${size}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}"
                                           th:if="${currentPage > 0}">
                                            <i class="fas fa-chevron-left"></i>
                                        </a>
                                        <span class="page-link" th:if="${currentPage == 0}">
                                            <i class="fas fa-chevron-left"></i>
                                        </span>
                                    </li>
                                    
                                    <li class="page-item"
                                        th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${pageNum == currentPage} ? 'active'">
                                        
                                        <a class="page-link" 
                                           th:href="@{/admin/trainers(page=${pageNum}, size=${size}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}"
                                           th:text="${pageNum + 1}"
                                           th:if="${pageNum != currentPage}">
                                        </a>
                                        <span class="page-link" 
                                              th:text="${pageNum + 1}"
                                              th:if="${pageNum == currentPage}">
                                        </span>
                                    </li>
                                    
                                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                        <a class="page-link" 
                                           th:href="@{/admin/trainers(page=${currentPage + 1}, size=${size}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}"
                                           th:if="${currentPage < totalPages - 1}">
                                            <i class="fas fa-chevron-right"></i>
                                        </a>
                                        <span class="page-link" th:if="${currentPage == totalPages - 1}">
                                            <i class="fas fa-chevron-right"></i>
                                        </span>
                                    </li>
                                </ul>
                            </nav>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <form id="deleteForm" method="post" th:action="@{/admin/trainers}" style="display: none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>
    <div th:replace="~{base :: footer}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const trainerId = this.getAttribute('data-trainer-id');
                    const name = this.getAttribute('data-trainer-name');
                    if (confirm(`Bạn có chắc chắn muốn xóa huấn luyện viên "${name}"?`)) {
                        const form = document.getElementById('deleteForm');
                        form.action = `/admin/trainers/delete/${trainerId}`;
                        form.submit();
                    }
                });
            });
        });
    </script>
</body>
</html>
