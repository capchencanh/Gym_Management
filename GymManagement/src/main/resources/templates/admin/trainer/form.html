<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${trainer.trainerId == null ? 'Thêm huấn luyện viên' : 'Chỉnh sửa huấn luyện viên'}">Quản lý huấn luyện viên</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-tie me-2"></i>
                            <span th:text="${trainer.trainerId == null ? 'Thêm huấn luyện viên mới' : 'Chỉnh sửa huấn luyện viên'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger alert-dismissible show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <form th:action="${trainer.trainerId == null ? '/admin/trainers/create' : '/admin/trainers/edit/' + trainer.trainerId}" 
                              th:object="${trainer}" method="post" class="needs-validation" novalidate>
                            <h5 class="text-primary mb-3">Thông tin cơ bản</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" name="name" 
                                               th:value="${trainer.user.name}" placeholder="Nhập họ và tên" required>
                                        <div class="invalid-feedback">
                                            Vui lòng nhập họ và tên
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                        <input type="email" class="form-control" id="email" name="email" 
                                               th:value="${trainer.user.email}" placeholder="example@email.com" required>
                                        <div class="invalid-feedback">
                                            Vui lòng nhập email hợp lệ
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="phoneNumber" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" 
                                               th:value="${trainer.user.phoneNumber}" placeholder="0123456789" required>
                                        <div class="invalid-feedback">
                                            Vui lòng nhập số điện thoại
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="specialization" class="form-label">Chuyên môn</label>
                                        <input type="text" class="form-control" id="specialization" name="specialization" 
                                               th:value="${trainer.specialization}" placeholder="Ví dụ: Yoga, Cardio, Strength Training...">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="gender" class="form-label">Giới tính</label>
                                        <select class="form-select" id="gender" name="gender">
                                            <option value="">Chọn giới tính</option>
                                            <option value="Nam" th:selected="${trainer.user.gender == 'Nam'}">Nam</option>
                                            <option value="Nữ" th:selected="${trainer.user.gender == 'Nữ'}">Nữ</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="birthdate" class="form-label">Ngày sinh</label>
                                        <input type="date" class="form-control" id="birthdate" name="birthdate" 
                                               th:value="${#dates.format(trainer.user.birthdate, 'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="height" class="form-label">Chiều cao (cm)</label>
                                        <input type="number" class="form-control" id="height" name="height" 
                                               th:value="${trainer.user.height}" placeholder="170" min="100" max="250">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="weight" class="form-label">Cân nặng (kg)</label>
                                        <input type="number" class="form-control" id="weight" name="weight" 
                                               th:value="${trainer.user.weight}" placeholder="65" min="30" max="300" step="0.1">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="fitnessGoal" class="form-label">Mục tiêu thể hình</label>
                                <textarea class="form-control" id="fitnessGoal" name="fitnessGoal" 
                                          rows="3" placeholder="Mô tả mục tiêu thể hình..." th:text="${trainer.user.fitnessGoal}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="schedule" class="form-label">Lịch làm việc</label>
                                <textarea class="form-control" id="schedule" name="schedule" 
                                          rows="3" placeholder="Mô tả lịch làm việc..." th:text="${trainer.schedule}"></textarea>
                            </div>
                            <h5 class="text-primary mb-3">Mật khẩu</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="passwordHash" class="form-label">
                                            <span th:text="${trainer.trainerId == null ? 'Mật khẩu' : 'Mật khẩu mới (để trống nếu không đổi)'}"></span>
                                            <span th:if="${trainer.trainerId == null}" class="text-danger">*</span>
                                        </label>
                                        <input type="password" class="form-control" id="passwordHash" name="passwordHash"
                                               th:required="${trainer.trainerId == null}"
                                               placeholder="Nhập mật khẩu">
                                        <div class="invalid-feedback">
                                            Vui lòng nhập mật khẩu
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">
                                            <span th:text="${trainer.trainerId == null ? 'Xác nhận mật khẩu' : 'Xác nhận mật khẩu mới'}"></span>
                                            <span th:if="${trainer.trainerId == null}" class="text-danger">*</span>
                                        </label>
                                        <input type="password" class="form-control" id="confirmPassword" 
                                               th:required="${trainer.trainerId == null}"
                                               placeholder="Nhập lại mật khẩu">
                                        <div class="invalid-feedback" id="confirmPasswordFeedback">
                                            Mật khẩu không khớp
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <a href="/admin/trainers" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                                </a>
                                <div>
                                    <button type="reset" class="btn btn-warning me-2">
                                        <i class="fas fa-undo me-1"></i>Làm mới
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-1"></i>
                                        <span th:text="${trainer.trainerId == null ? 'Thêm huấn luyện viên' : 'Cập nhật'}"></span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{base :: footer}"></div>
    <script>
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByClassName('needs-validation');
                var validation = Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        var password = document.getElementById('passwordHash');
                        var confirmPassword = document.getElementById('confirmPassword');
                        if (password && confirmPassword && password.value && confirmPassword.value && password.value !== confirmPassword.value) {
                            event.preventDefault();
                            confirmPassword.setCustomValidity('Mật khẩu không khớp');
                        } else if (confirmPassword) {
                            confirmPassword.setCustomValidity('');
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
        if (document.getElementById('confirmPassword')) {
            document.getElementById('confirmPassword').addEventListener('input', function() {
                var password = document.getElementById('passwordHash');
                var confirmPassword = this;
                if (password && confirmPassword && password.value && confirmPassword.value && password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Mật khẩu không khớp');
                } else {
                    confirmPassword.setCustomValidity('');
                }
            });
        }
    </script>
</body>
</html>
