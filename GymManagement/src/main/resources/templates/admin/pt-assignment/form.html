<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo Assignment mới</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-plus me-2"></i>Tạo Assignment mới
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/pt-assignments/create}" method="post">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="userId" class="form-label">Chọn User:</label>
                                        <select class="form-select" id="userId" name="userId" required>
                                            <option value="">-- Chọn User --</option>
                                            <option th:each="user : ${users}" 
                                                    th:value="${user.userId}" 
                                                    th:text="${user.name + ' (' + user.email + ')'}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="trainerId" class="form-label">Chọn PT:</label>
                                        <select class="form-select" id="trainerId" name="trainerId" required>
                                            <option value="">-- Chọn PT --</option>
                                            <option th:each="trainer : ${trainers}" 
                                                    th:value="${trainer.trainerId}" 
                                                    th:text="${trainer.user.name + ' - ' + trainer.specialization}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Lưu ý</label>
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    Sau khi tạo assignment, PT sẽ tự lên lịch tập dựa trên thời gian rảnh của user.
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/admin/pt-assignments" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save me-1"></i>Tạo Assignment
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="~{base :: footer}"></div>
</body>
</html>
