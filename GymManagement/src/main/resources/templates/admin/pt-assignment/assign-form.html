<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân công PT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-user-plus"></i> Phân công PT</h4>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>User:</strong>
                                <p th:text="${assignment.user.name}">User Name</p>
                            </div>
                            <div class="col-md-6">
                                <strong>Email:</strong>
                                <p th:text="${assignment.user.email}">user@email.com</p>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Trạng thái hiện tại:</strong>
                                <span th:class="${'badge bg-' + (assignment.status == 'PENDING' ? 'warning' : 'info')}" 
                                      th:text="${assignment.status == 'PENDING' ? 'Đang chờ' : 'Đã phân công'}">
                                    Status
                                </span>
                            </div>
                            <div class="col-md-6">
                                <strong>Ngày yêu cầu:</strong>
                                <p th:text="${#dates.format(assignment.createdAt, 'dd/MM/yyyy HH:mm')}">Date</p>
                            </div>
                        </div>
                        
                        <form th:action="@{/admin/pt-assignments/assign/{id}(id=${assignment.assignmentId})}" method="post">
                            <div class="mb-3">
                                <label for="trainerId" class="form-label">Chọn PT:</label>
                                <select class="form-select" id="trainerId" name="trainerId" required>
                                    <option value="">-- Chọn PT --</option>
                                    <option th:each="trainer : ${availableTrainers}" 
                                            th:value="${trainer.trainerId}"
                                            th:text="${trainer.user.name + ' - ' + trainer.specialization}">
                                        Trainer Name - Specialization
                                    </option>
                                </select>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/pt-assignments}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-check"></i> Phân công PT
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
