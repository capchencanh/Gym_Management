<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết thiết bị</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .device-image-large {
            width: 100%;
            max-width: 300px;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #e9ecef;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .device-image-large:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .image-container {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .no-image {
            width: 100%;
            max-width: 300px;
            height: 250px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 3px dashed #dee2e6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #6c757d;
        }
        .no-image i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-cogs me-2"></i>Chi tiết thiết bị
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div class="row">
                            <div class="col-md-8">
                                <h5 class="text-primary mb-3">Thông tin thiết bị</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">ID thiết bị</label>
                                            <p class="form-control-plaintext" th:text="${device.deviceId}"></p>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Tên thiết bị</label>
                                            <p class="form-control-plaintext" th:text="${device.name}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Loại thiết bị</label>
                                            <p class="form-control-plaintext" th:text="${device.type}"></p>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Trạng thái</label>
                                            <p>
                                                <span th:if="${device.status == 'AVAILABLE'}" class="badge bg-success">Sẵn sàng</span>
                                                <span th:if="${device.status == 'IN_USE'}" class="badge bg-info">Đang sử dụng</span>
                                                <span th:if="${device.status == 'MAINTENANCE'}" class="badge bg-warning">Bảo trì</span>
                                                <span th:if="${device.status == 'BROKEN'}" class="badge bg-danger">Hỏng</span>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Vị trí</label>
                                            <p class="form-control-plaintext" th:text="${device.location}"></p>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Ngày bảo trì</label>
                                            <p class="form-control-plaintext" th:text="${device.maintenanceDate != null ? #temporals.format(device.maintenanceDate, 'dd/MM/yyyy') : '-'}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Lần bảo trì cuối</label>
                                            <p class="form-control-plaintext" th:text="${device.lastServiceDate != null ? #temporals.format(device.lastServiceDate, 'dd/MM/yyyy') : '-'}"></p>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold">Ngày tạo</label>
                                            <p class="form-control-plaintext" th:text="${device.createdAt != null ? #temporals.format(device.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></p>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Ghi chú</label>
                                    <p class="form-control-plaintext" th:text="${device.notes != null ? device.notes : '-'}"></p>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <h5 class="text-primary mb-3">Hình ảnh thiết bị</h5>
                                <div class="image-container">
                                    <img th:if="${device.image != null}" th:src="${device.image}" 
                                         class="device-image-large" alt="Ảnh thiết bị">
                                    <div th:unless="${device.image != null}" class="no-image">
                                        <i class="fas fa-image"></i>
                                        <p>Chưa có hình ảnh</p>
                                    </div>
                                </div>
                                
                                <h5 class="text-primary mb-3">Thống kê</h5>
                                <div class="card bg-primary text-white mb-3">
                                    <div class="card-body text-center">
                                        <h6>Trạng thái hiện tại</h6>
                                        <h4 th:text="${device.status}">-</h4>
                                    </div>
                                </div>
                                <div class="card bg-info text-white mb-3">
                                    <div class="card-body text-center">
                                        <h6>Vị trí</h6>
                                        <h4 th:text="${device.location}">-</h4>
                                    </div>
                                </div>
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h6>Loại thiết bị</h6>
                                        <h4 th:text="${device.type}">-</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <a href="/admin/devices" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Quay lại
                            </a>
                            <div>
                                <a th:href="@{/admin/devices/edit/{id}(id=${device.deviceId})}" class="btn btn-warning me-2">
                                    <i class="fas fa-edit me-1"></i>Chỉnh sửa
                                </a>
                                <button type="button" class="btn btn-danger delete-btn" 
                                        th:data-device-id="${device.deviceId}"
                                        th:data-device-name="${device.name}">
                                    <i class="fas fa-trash me-1"></i>Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <form id="deleteForm" method="post" style="display: none;">
    </form>
    <div th:replace="~{base :: footer}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const deleteButton = document.querySelector('.delete-btn');
            if (deleteButton) {
                deleteButton.addEventListener('click', function() {
                    const deviceId = this.getAttribute('data-device-id');
                    const name = this.getAttribute('data-device-name');
                    if (confirm(`Bạn có chắc chắn muốn xóa thiết bị "${name}"?`)) {
                        const form = document.getElementById('deleteForm');
                        form.action = `/admin/devices/delete/${deviceId}`;
                        form.submit();
                    }
                });
            }
        });
    </script>
</body>
</html>
