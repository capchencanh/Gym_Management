<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý thiết bị</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .device-image {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #e9ecef;
        }
        .device-image:hover {
            transform: scale(1.1);
            transition: transform 0.2s ease;
        }
        .image-modal .modal-body {
            text-align: center;
        }
        .image-modal img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-cogs me-2"></i>Quản lý thiết bị
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div class="mb-3">
                            <a href="/admin/devices/create" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>Thêm thiết bị mới
                            </a>
                        </div>
                        <div class="card mb-3">
                            <div class="card-body">
                                <form th:action="@{/admin/devices}" method="get" class="row g-3">
                                    <div class="col-md-6">
                                        <label for="keyword" class="form-label">Tìm kiếm</label>
                                        <input type="text" class="form-control" id="keyword" name="name" 
                                               th:value="${name}" placeholder="Nhập tên thiết bị...">
                                    </div>
                                    <div class="col-md-3">
                                        <label for="status" class="form-label">Trạng thái</label>
                                        <select class="form-select" id="status" name="status">
                                            <option value="">Tất cả trạng thái</option>
                                            <option value="AVAILABLE" th:selected="${selectedStatus == 'AVAILABLE'}">Sẵn sàng</option>
                                            <option value="IN_USE" th:selected="${selectedStatus == 'IN_USE'}">Đang sử dụng</option>
                                            <option value="MAINTENANCE" th:selected="${selectedStatus == 'MAINTENANCE'}">Bảo trì</option>
                                            <option value="BROKEN" th:selected="${selectedStatus == 'BROKEN'}">Hỏng</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button type="submit" class="btn btn-primary me-2">
                                            <i class="fas fa-search me-1"></i>Tìm kiếm
                                        </button>
                                        <a href="/admin/devices" class="btn btn-secondary">
                                            <i class="fas fa-refresh me-1"></i>Làm mới
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <div class="card bg-primary text-white">
                                    <div class="card-body text-center">
                                        <h5>Tổng số</h5>
                                        <h3 th:text="${totalDevices}">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-success text-white">
                                    <div class="card-body text-center">
                                        <h5>Sẵn sàng</h5>
                                        <h3 th:text="${availableCount}">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-warning text-white">
                                    <div class="card-body text-center">
                                        <h5>Bảo trì</h5>
                                        <h3 th:text="${maintenanceCount}">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card bg-danger text-white">
                                    <div class="card-body text-center">
                                        <h5>Hỏng</h5>
                                        <h3 th:text="${brokenCount}">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Hình ảnh</th>
                                        <th>Tên thiết bị</th>
                                        <th>Loại</th>
                                        <th>Trạng thái</th>
                                        <th>Vị trí</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="device : ${devices}">
                                        <td th:text="${device.deviceId}"></td>
                                        <td>
                                            <div class="text-center">
                                                <img th:if="${device.image != null}" th:src="${device.image}" 
                                                     class="device-image" alt="Ảnh thiết bị"
                                                     data-bs-toggle="modal" data-bs-target="#imageModal"
                                                     th:data-image-url="${device.image}"
                                                     th:data-device-name="${device.name}"
                                                     style="cursor: pointer;">
                                                <img th:unless="${device.image != null}" src="/images/placeholder-device.png" 
                                                     class="device-image" alt="Ảnh mặc định">
                                            </div>
                                        </td>
                                        <td th:text="${device.name}"></td>
                                        <td th:text="${device.type}"></td>
                                        <td>
                                            <span th:if="${device.status == 'AVAILABLE'}" class="badge bg-success">Sẵn sàng</span>
                                            <span th:if="${device.status == 'IN_USE'}" class="badge bg-info">Đang sử dụng</span>
                                            <span th:if="${device.status == 'MAINTENANCE'}" class="badge bg-warning">Bảo trì</span>
                                            <span th:if="${device.status == 'BROKEN'}" class="badge bg-danger">Hỏng</span>
                                        </td>
                                        <td th:text="${device.location}"></td>
                                        <td>
                                            <a th:href="@{/admin/devices/view/{id}(id=${device.deviceId})}" 
                                               class="btn btn-sm btn-info me-1" title="Xem">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{/admin/devices/edit/{id}(id=${device.deviceId})}" 
                                               class="btn btn-sm btn-warning me-1" title="Sửa">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <button type="button" class="btn btn-sm btn-danger delete-btn" 
                                                    title="Xóa"
                                                    th:data-device-id="${device.deviceId}"
                                                    th:data-device-name="${device.name}">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(devices)}">
                                        <td colspan="7" class="text-center text-muted py-4">
                                            <i class="fas fa-cogs fa-2x mb-2"></i>
                                            <p>Không có dữ liệu thiết bị</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    

    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalLabel">Hình ảnh thiết bị</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <img id="modalImage" src="" alt="Hình ảnh thiết bị" class="img-fluid">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>
    
    <form id="deleteForm" method="post" th:action="@{/admin/devices}" style="display: none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>
    <div th:replace="~{base :: footer}"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Delete functionality
            const deleteButtons = document.querySelectorAll('.delete-btn');
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const deviceId = this.getAttribute('data-device-id');
                    const name = this.getAttribute('data-device-name');
                    if (confirm(`Bạn có chắc chắn muốn xóa thiết bị "${name}"?`)) {
                        const form = document.getElementById('deleteForm');
                        form.action = `/admin/devices/delete/${deviceId}`;
                        form.submit();
                    }
                });
            });
            

            const imageModal = document.getElementById('imageModal');
            if (imageModal) {
                imageModal.addEventListener('show.bs.modal', function (event) {
                    const button = event.relatedTarget;
                    const imageUrl = button.getAttribute('data-image-url');
                    const deviceName = button.getAttribute('data-device-name');
                    const modalImage = document.getElementById('modalImage');
                    const modalTitle = document.getElementById('imageModalLabel');
                    
                    modalImage.src = imageUrl;
                    modalTitle.textContent = `Hình ảnh thiết bị: ${deviceName}`;
                });
            }
        });
    </script>
</body>
</html>
