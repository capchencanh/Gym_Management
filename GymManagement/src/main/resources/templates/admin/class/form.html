<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${trainingClass.classId != null ? 'Chỉnh sửa lớp tập' : 'Thêm lớp tập mới'}"></title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-chalkboard-teacher me-2"></i>
                            <span th:text="${trainingClass.classId != null ? 'Chỉnh sửa lớp tập' : 'Thêm lớp tập mới'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${success}" class="alert alert-success alert-dismissible show" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <form th:action="${trainingClass.classId != null ? '/admin/classes/edit/' + trainingClass.classId : '/admin/classes/create'}" 
                              th:object="${trainingClass}" method="post" class="needs-validation" novalidate>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Tên lớp <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                        <div class="invalid-feedback">Vui lòng nhập tên lớp</div>
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="trainerId" class="form-label">PT</label>
                                        <select class="form-select" id="trainerId" name="trainerId">
                                            <option value="">-- Chọn PT --</option>
                                            <option th:each="trainer : ${trainers}" 
                                                    th:value="${trainer.trainerId}"
                                                    th:text="${trainer.name}"
                                                    th:selected="${trainingClass.trainer != null and trainingClass.trainer.trainerId == trainer.trainerId}">
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Mô tả</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="schedule" class="form-label">Lịch học</label>
                                <input type="text" class="form-control" id="schedule" th:field="*{schedule}" 
                                       placeholder="VD: Thứ 2, 4, 6 từ 18:00-19:00">
                                <div class="form-text">Mô tả chi tiết lịch học của lớp</div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="maxParticipants" class="form-label">Số học viên tối đa</label>
                                        <input type="number" class="form-control" id="maxParticipants" th:field="*{maxParticipants}" min="1">
                                    </div>
                                </div>
                                
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="price" class="form-label">Giá (VNĐ)</label>
                                        <input type="number" class="form-control" id="price" th:field="*{price}" min="0" step="1000">
                                    </div>
                                </div>
                                
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="durationMinutes" class="form-label">Thời lượng (phút)</label>
                                        <input type="number" class="form-control" id="durationMinutes" th:field="*{durationMinutes}" min="15" max="180" value="60">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="startTime" class="form-label">Giờ bắt đầu</label>
                                <input type="time" class="form-control" id="startTime" th:field="*{startTime}" 
                                       placeholder="HH:MM">
                                <div class="form-text">Định dạng: HH:MM (VD: 18:00) - Có thể để trống</div>
                            </div>

                            <div class="d-flex justify-content-end">
                                <a href="/admin/classes" class="btn btn-secondary me-2">
                                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>
                                    <span th:text="${trainingClass.classId != null ? 'Cập nhật' : 'Thêm lớp'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{base :: footer}"></div>
    <script>
        // Form validation
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByTagName('form');
                var validation = Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>
</body>
</html>
