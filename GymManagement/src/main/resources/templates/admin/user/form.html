<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${user.userId == null ? 'Thêm người dùng' : 'Chỉnh sửa người dùng'}">Quản lý người dùng</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user me-2"></i>
                            <span th:text="${user.userId == null ? 'Thêm người dùng mới' : 'Chỉnh sửa người dùng'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger alert-dismissible show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <form th:action="${user.userId == null ? '/admin/users/create' : '/admin/users/edit/' + user.userId}" 
                              th:object="${user}" method="post" class="needs-validation" novalidate>
                            <h5 class="text-primary mb-3">Thông tin cơ bản</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" th:field="*{name}" 
                                               placeholder="Nhập họ và tên" required>
                                        <div class="invalid-feedback">
                                            Vui lòng nhập họ và tên
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                        <input type="email" class="form-control" id="email" th:field="*{email}" 
                                               placeholder="example@email.com" required>
                                        <div class="invalid-feedback">
                                            Vui lòng nhập email hợp lệ
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="phoneNumber" class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                                        <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" 
                                               placeholder="0123456789" required>
                                        <div class="invalid-feedback">
                                            Vui lòng nhập số điện thoại
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="role" class="form-label">Vai trò <span class="text-danger">*</span></label>
                                        <select class="form-select" id="role" th:field="*{role}" required>
                                            <option value="">Chọn vai trò</option>
                                            <option value="USER">Người dùng</option>
                                            <option value="PT">Huấn luyện viên</option>
                                            <option value="ADMIN">Quản trị viên</option>
                                        </select>
                                        <div class="invalid-feedback">
                                            Vui lòng chọn vai trò
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="gender" class="form-label">Giới tính</label>
                                        <select class="form-select" id="gender" th:field="*{gender}">
                                            <option value="">Chọn giới tính</option>
                                            <option value="Nam">Nam</option>
                                            <option value="Nữ">Nữ</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="birthdate" class="form-label">Ngày sinh</label>
                                        <input type="date" class="form-control" id="birthdate" th:field="*{birthdate}">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="height" class="form-label">Chiều cao (cm)</label>
                                        <input type="number" class="form-control" id="height" th:field="*{height}" 
                                               placeholder="170" min="100" max="250">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="weight" class="form-label">Cân nặng (kg)</label>
                                        <input type="number" class="form-control" id="weight" th:field="*{weight}" 
                                               placeholder="65" min="30" max="300" step="0.1">
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="fitnessGoal" class="form-label">Mục tiêu thể hình</label>
                                <textarea class="form-control" id="fitnessGoal" th:field="*{fitnessGoal}" 
                                          rows="3" placeholder="Mô tả mục tiêu thể hình..."></textarea>
                            </div>
                            
                            <!-- Trainer Information Section -->
                            <div id="trainerSection" style="display: none;">
                                <h5 class="text-primary mb-3">Thông tin huấn luyện viên</h5>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="specialization" class="form-label">Chuyên môn</label>
                                            <input type="text" class="form-control" id="specialization" name="specialization" 
                                                   placeholder="Ví dụ: Yoga, Cardio, Strength Training...">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="schedule" class="form-label">Lịch làm việc</label>
                                            <input type="text" class="form-control" id="schedule" name="schedule" 
                                                   placeholder="Ví dụ: Thứ 2-6, 8h-17h">
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="experience" class="form-label">Kinh nghiệm</label>
                                    <textarea class="form-control" id="experience" name="experience" 
                                              rows="3" placeholder="Mô tả kinh nghiệm làm việc..."></textarea>
                                </div>
                            </div>
                            
                            <h5 class="text-primary mb-3">Mật khẩu</h5>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="passwordHash" class="form-label">
                                            <span th:text="${user.userId == null ? 'Mật khẩu' : 'Mật khẩu mới (để trống nếu không đổi)'}"></span>
                                            <span th:if="${user.userId == null}" class="text-danger">*</span>
                                        </label>
                                        <input type="password" class="form-control" id="passwordHash" 
                                               th:field="*{passwordHash}" 
                                               th:required="${user.userId == null}"
                                               placeholder="Nhập mật khẩu">
                                        <div class="invalid-feedback">
                                            Vui lòng nhập mật khẩu
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">
                                            <span th:text="${user.userId == null ? 'Xác nhận mật khẩu' : 'Xác nhận mật khẩu mới'}"></span>
                                            <span th:if="${user.userId == null}" class="text-danger">*</span>
                                        </label>
                                        <input type="password" class="form-control" id="confirmPassword" 
                                               th:required="${user.userId == null}"
                                               placeholder="Nhập lại mật khẩu">
                                        <div class="invalid-feedback" id="confirmPasswordFeedback">
                                            Mật khẩu không khớp
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <a href="/admin/users" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Quay lại
                                </a>
                                <div>
                                    <button type="reset" class="btn btn-warning me-2">
                                        <i class="fas fa-undo me-1"></i>Làm mới
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-1"></i>
                                        <span th:text="${user.userId == null ? 'Thêm người dùng' : 'Cập nhật'}"></span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{base :: footer}"></div>
    <script>
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByClassName('needs-validation');
                var validation = Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        var password = document.getElementById('passwordHash');
                        var confirmPassword = document.getElementById('confirmPassword');
                        if (password && confirmPassword && password.value && confirmPassword.value && password.value !== confirmPassword.value) {
                            event.preventDefault();
                            confirmPassword.setCustomValidity('Mật khẩu không khớp');
                        } else if (confirmPassword) {
                            confirmPassword.setCustomValidity('');
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
        if (document.getElementById('confirmPassword')) {
            document.getElementById('confirmPassword').addEventListener('input', function() {
                var password = document.getElementById('passwordHash');
                var confirmPassword = this;
                if (password && confirmPassword && password.value && confirmPassword.value && password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity('Mật khẩu không khớp');
                } else {
                    confirmPassword.setCustomValidity('');
                }
            });
        }
        
        // Toggle trainer section based on role
        document.getElementById('role').addEventListener('change', function() {
            var trainerSection = document.getElementById('trainerSection');
            if (this.value === 'PT') {
                trainerSection.style.display = 'block';
            } else {
                trainerSection.style.display = 'none';
            }
        });
        
        // Show trainer section on page load if role is PT
        window.addEventListener('load', function() {
            var roleSelect = document.getElementById('role');
            var trainerSection = document.getElementById('trainerSection');
            if (roleSelect.value === 'PT') {
                trainerSection.style.display = 'block';
            }
        });
    </script>
</body>
</html>
