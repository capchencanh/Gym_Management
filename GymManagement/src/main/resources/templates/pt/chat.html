<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - PT Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 100px);
            background: #f8f9fa;
        }
        
        .chat-sidebar {
            background: white;
            border-right: 1px solid #dee2e6;
            height: 100%;
            overflow-y: auto;
        }
        
        .chat-main {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .conversation-item {
            padding: 15px;
            border-bottom: 1px solid #f1f3f4;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .conversation-item:hover {
            background-color: #f8f9fa;
        }
        
        .conversation-item.active {
            background-color: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .conversation-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e3f2fd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2196f3;
            font-size: 18px;
        }
        
        .conversation-info h6 {
            margin: 0;
            font-weight: 600;
            color: #333;
        }
        
        .conversation-info p {
            margin: 0;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .message.own {
            justify-content: flex-end;
        }
        
        .message.other {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }
        
        .message.own .message-content {
            background: #2196f3;
            color: white;
            border-bottom-right-radius: 6px;
        }
        
        .message.other .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 6px;
        }
        
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
        }
        
        .chat-input-section {
            background: white;
            padding: 20px;
            border-top: 1px solid #dee2e6;
        }
        
        .chat-input-container {
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .chat-input:focus {
            border-color: #2196f3;
        }
        
        .send-button {
            width: 44px;
            height: 44px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .send-button:hover {
            background: #1976d2;
        }
        
        .no-conversation {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            text-align: center;
        }
        
        .no-conversation i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .unread-badge {
            background: #f44336;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-4 col-lg-3 p-0">
                <div class="chat-sidebar">
                    <div class="p-3 border-bottom">
                        <h5 class="mb-0">
                            <i class="fas fa-comments text-primary me-2"></i>
                            Tin nhắn
                        </h5>
                    </div>
                    
                    <div id="conversations-list">
                        <div th:if="${#lists.isEmpty(recentConversations)}" class="p-3 text-center text-muted">
                            <i class="fas fa-inbox fa-2x mb-2"></i>
                            <p>Chưa có cuộc trò chuyện nào</p>
                        </div>
                        
                        <div th:each="conversation : ${recentConversations}" 
                             th:data-user-id="${conversation.sender.userId == currentUser.userId ? conversation.receiver.userId : conversation.sender.userId}"
                             class="conversation-item"
                             th:onclick="'openConversation(' + (conversation.sender.userId == currentUser.userId ? conversation.receiver.userId : conversation.sender.userId) + ')'">
                            
                            <div class="d-flex align-items-center">
                                <div class="conversation-avatar me-3">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div class="conversation-info flex-grow-1">
                                    <h6 th:text="${conversation.sender.userId == currentUser.userId ? conversation.receiver.fullName : conversation.sender.fullName}">
                                        User Name
                                    </h6>
                                    <p th:text="${conversation.message}">Last message...</p>
                                </div>
                                <div th:if="${!conversation.readStatus && conversation.receiver.userId == currentUser.userId}" 
                                     class="unread-badge"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Chat Area -->
            <div class="col-md-8 col-lg-9 p-0">
                <div class="chat-main">
                    <div id="no-conversation" class="no-conversation">
                        <i class="fas fa-comments"></i>
                        <h4>Chọn một cuộc trò chuyện</h4>
                        <p>Chọn một cuộc trò chuyện từ danh sách bên trái để bắt đầu chat</p>
                    </div>
                    
                    <div id="chat-area" style="display: none;">
                        <div class="chat-header">
                            <div class="conversation-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <h5 id="chat-user-name" class="mb-0">User Name</h5>
                                <small class="text-muted">Đang hoạt động</small>
                            </div>
                        </div>
                        
                        <div class="chat-messages" id="messages-container">
                            <!-- Messages will be loaded here -->
                        </div>
                        
                        <div class="chat-input-section">
                            <form id="message-form">
                                <div class="chat-input-container">
                                    <input type="text" 
                                           id="message-input" 
                                           class="chat-input" 
                                           placeholder="Nhập tin nhắn..."
                                           autocomplete="off">
                                    <button type="submit" class="send-button">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase Web SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, off, push, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        
        let firebaseConfig = null;
        let app = null;
        let database = null;
        
        // Lấy Firebase config từ server
        async function initializeFirebase() {
            try {
                const response = await fetch('/api/firebase/config');
                if (response.ok) {
                    firebaseConfig = await response.json();
                    
                    // Initialize Firebase
                    app = initializeApp(firebaseConfig);
                    database = getDatabase(app);
                    
                    // Sau khi Firebase đã sẵn sàng, lấy PT ID
                    getCurrentPTId();
                } else {
                    console.error('Failed to get Firebase config');
                }
            } catch (error) {
                console.error('Error getting Firebase config:', error);
            }
        }
        
        let currentUserId = null;
        let currentConversationUserId = null;
        let currentListener = null;
        
                                    // Lấy current PT ID từ server
        async function getCurrentPTId() {
            try {
                const response = await fetch('/api/pt/current');
                
                if (response.ok) {
                    const data = await response.json();
                    currentUserId = data.ptId;
                    
                    // Load conversations sau khi có PT ID
                    loadConversations();
                } else {
                    console.error('Failed to get current PT ID:', response.status);
                }
            } catch (error) {
                console.error('Error getting current PT ID:', error);
            }
        }
        
        // Load danh sách conversations
        async function loadConversations() {
            if (!currentUserId) return;
            
            try {
                const response = await fetch(`/api/pt/conversations/${currentUserId}`);
                
                if (response.ok) {
                    const conversations = await response.json();
                    displayConversations(conversations);
                } else {
                    console.error('Failed to load conversations:', response.status);
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }
        

        
        // Hiển thị danh sách conversations
        function displayConversations(conversations) {
            const container = document.getElementById('conversations-list');
            
            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="p-3 text-center text-muted">
                        <i class="fas fa-inbox fa-2x mb-2"></i>
                        <p>Chưa có cuộc trò chuyện nào</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = conversations.map(conv => `
                <div class="conversation-item" 
                     data-user-id="${conv.userId}"
                     onclick="openConversation(${conv.userId}, '${conv.userName}')">
                    <div class="d-flex align-items-center">
                        <div class="conversation-avatar me-3">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="conversation-info flex-grow-1">
                            <h6>${conv.userName}</h6>
                            <p>${conv.lastMessage || 'Chưa có tin nhắn'}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Mở cuộc trò chuyện - đưa ra global scope
        window.openConversation = function(userId, userName) {
            currentConversationUserId = userId;
            
            // Cập nhật UI
            document.getElementById('no-conversation').style.display = 'none';
            document.getElementById('chat-area').style.display = 'block';
            
            // Cập nhật active state cho sidebar
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // Load tin nhắn
            loadConversation(userId);
            
            // Cập nhật tên user
            document.getElementById('chat-user-name').textContent = userName;
        };
        
        // Tạo chat room ID - đưa ra global scope
        window.createChatRoomId = function(userId1, userId2) {
            const sortedIds = [userId1, userId2].sort();
            return `${sortedIds[0]}_${sortedIds[1]}`;
        };
        
        // Load cuộc trò chuyện với Firebase real-time - đưa ra global scope
        window.loadConversation = function(userId) {
            // Dừng listener cũ nếu có
            if (currentListener) {
                off(currentListener);
            }
            
            const chatRoomId = createChatRoomId(currentUserId, userId);
            const chatRef = ref(database, `chats/${chatRoomId}`);
            
            // Lắng nghe real-time
            currentListener = onValue(chatRef, (snapshot) => {
                const messages = [];
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const message = childSnapshot.val();
                        const messageId = childSnapshot.key;
                        messages.push({
                            id: messageId,
                            ...message
                        });
                    });
                    
                    // Sắp xếp theo timestamp
                    messages.sort((a, b) => {
                        if (a.timestamp && b.timestamp) {
                            return a.timestamp - b.timestamp;
                        }
                        return 0;
                    });
                }
                
                displayMessages(messages);
            });
        };
        
        // Hiển thị tin nhắn - đưa ra global scope
        window.displayMessages = function(messages) {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${message.senderId === currentUserId ? 'own' : 'other'}`;
                
                const messageContent = document.createElement('div');
                messageContent.className = 'message-content';
                
                const messageText = document.createElement('p');
                messageText.textContent = message.message;
                
                const messageTime = document.createElement('span');
                messageTime.className = 'message-time';
                messageTime.textContent = formatTime(message.timestamp);
                
                messageContent.appendChild(messageText);
                messageContent.appendChild(messageTime);
                messageDiv.appendChild(messageContent);
                container.appendChild(messageDiv);
            });
            
            // Scroll xuống cuối
            container.scrollTop = container.scrollHeight;
        };
        
        // Gửi tin nhắn với Firebase
        document.getElementById('message-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message || !currentConversationUserId) return;
            
            // Gửi tin nhắn qua Firebase
            const chatRoomId = createChatRoomId(currentUserId, currentConversationUserId);
            const chatRef = ref(database, `chats/${chatRoomId}`);
            
            const newMessage = {
                senderId: currentUserId,
                receiverId: currentConversationUserId,
                message: message,
                timestamp: serverTimestamp(),
                read: false
            };
            
            push(chatRef, newMessage)
                .then(() => {
                    input.value = '';
                    // Tin nhắn sẽ tự động xuất hiện qua Firebase listener
                })
                .catch(error => {
                    // Error sending message
                });
        });
        
        // Format thời gian
        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('vi-VN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
        
        
        
        // Khởi tạo khi page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeFirebase();
        });
        
        
    </script>
</body>
</html>
