<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Gym Management</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-wrapper register-wrapper">
        <div class="auth-form-container">
            <div class="auth-form-header">
                <h2>Quên mật khẩu</h2>
                <p>Nhập email của bạn để nhận link đặt lại mật khẩu</p>
            </div>
            
            <div th:if="${message}" th:class="${messageType == 'success' ? 'alert alert-success' : 'alert alert-danger'}">
                <i th:class="${messageType == 'success' ? 'fas fa-check-circle me-2' : 'fas fa-exclamation-circle me-2'}"></i>
                <span th:text="${message}"></span>
            </div>
            
            <form th:action="@{/forgot-password}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" name="email" 
                           placeholder="Nhập email của bạn" required>
                </div>
                
                <button type="submit" class="btn-auth">
                    Gửi link đặt lại mật khẩu
                </button>
            </form>
            
            <div class="auth-footer">
                <p><a href="/login">Quay lại đăng nhập</a></p>
            </div>
        </div>
    </div>
</body>
</html>
