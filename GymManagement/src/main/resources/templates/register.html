<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Gym Management</title>
    <th:block th:replace="~{base :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-wrapper register-wrapper">
        <div class="auth-form-container">
            <div class="auth-form-header">
                <h2>Đăng ký tài khoản</h2>
                <p>Tạo tài khoản mới để bắt đầu</p>
            </div>
            
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="alert alert-success">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${success}"></span>
            </div>
            
            <form th:action="@{/register}" method="post" th:object="${user}" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name" class="form-label">Họ và tên <span class="required">*</span></label>
                        <input type="text" class="form-input" id="name" th:field="*{name}" 
                               placeholder="Nhập họ và tên" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email <span class="required">*</span></label>
                        <input type="email" class="form-input" id="email" th:field="*{email}" 
                               placeholder="example@email.com" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="phoneNumber" class="form-label">Số điện thoại <span class="required">*</span></label>
                        <input type="tel" class="form-input" id="phoneNumber" th:field="*{phoneNumber}" 
                               placeholder="0123456789" required>
                    </div>
                    <div class="form-group">
                        <label for="gender" class="form-label">Giới tính</label>
                        <select class="form-select" id="gender" th:field="*{gender}">
                            <option value="">Chọn giới tính</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="role" class="form-label">Vai trò <span class="required">*</span></label>
                        <select class="form-select" id="role" th:field="*{role}" required>
                            <option value="">Chọn vai trò</option>
                            <option value="USER">Người dùng</option>
                            <option value="PT">Huấn luyện viên</option>
                            <option value="ADMIN">Quản trị viên</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="birthdate" class="form-label">Ngày sinh</label>
                        <input type="date" class="form-input" id="birthdate" th:field="*{birthdate}">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="height" class="form-label">Chiều cao (cm)</label>
                        <input type="number" class="form-input" id="height" th:field="*{height}" 
                               placeholder="170" min="100" max="250">
                    </div>
                    <div class="form-group">
                        <label for="weight" class="form-label">Cân nặng (kg)</label>
                        <input type="number" class="form-input" id="weight" th:field="*{weight}" 
                               placeholder="65" min="30" max="300" step="0.1">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="fitnessGoal" class="form-label">Mục tiêu thể hình</label>
                    <textarea class="form-input" id="fitnessGoal" th:field="*{fitnessGoal}" 
                              rows="3" placeholder="Mô tả mục tiêu thể hình của bạn..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="passwordHash" class="form-label">Mật khẩu <span class="required">*</span></label>
                        <input type="password" class="form-input" id="passwordHash" 
                               th:field="*{passwordHash}" 
                               placeholder="Nhập mật khẩu" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu <span class="required">*</span></label>
                        <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                               placeholder="Nhập lại mật khẩu" required>
                    </div>
                </div>
                
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="agree" required>
                    <label class="form-check-label" for="agree">
                        Tôi đồng ý với <a href="#">điều khoản sử dụng</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-auth">
                    Đăng ký
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Đã có tài khoản? <a href="/login">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>
</body>
</html>
