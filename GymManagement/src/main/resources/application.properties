# DB
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jackson.property-naming-strategy=SNAKE_CASE

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Email Config
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY}
spring.mail.from=danhvip83@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.sendgrid.net

# Firebase Config
firebase.api.key=${FIREBASE_API_KEY}
firebase.auth.domain=${FIREBASE_AUTH_DOMAIN}
firebase.database.url=${FIREBASE_DATABASE_URL}
firebase.project.id=${FIREBASE_PROJECT_ID}
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET}
firebase.messaging.sender.id=${FIREBASE_MESSAGING_SENDER_ID}
firebase.app.id=${FIREBASE_APP_ID}
firebase.measurement.id=${FIREBASE_MEASUREMENT_ID}

